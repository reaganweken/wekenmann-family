
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wekenmanns | Christmas 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #153b2b;
      color: #f8f3e8;
      text-align: center;
    }

    header {
      padding: 65px 20px 35px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 2.7rem;
      font-weight: normal;
      margin: 0 0 12px;
    }

    .gold-line {
      width: 85px;
      height: 2px;
      background: #c6a45c;
      margin: 22px auto;
    }

    .year {
      color: #d2b878;
      letter-spacing: 4px;
      font-size: 1rem;
    }

    .content {
      max-width: 850px;
      margin: 0 auto;
      padding: 15px 20px 60px;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border: 1px solid #c6a45c;
      border-radius: 8px;
      background: #0d291e;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      padding: 25px;
      color: #c6a45c;
      font-family: Georgia, serif;
      font-size: 0.95rem;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      header {
        padding-top: 50px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Merry Christmas from the Wekenmanns</h1>
    <div class="gold-line"></div>
    <div class="year">CHRISTMAS 2026</div>
  </header>

  <main class="content">

    <div class="video-container">
      <iframe
        src="https://www.youtube-nocookie.com/embed/VIDEO_ID"
        title="The Wekenmanns Christmas 2026"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <!-- Additional photos or Christmas updates can go here in the future -->

  </main>

  <footer>
    With love, The Wekenmanns
  </footer>

</body>
</html>
